<html lang="pt-BR">
<head>

<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src data:; connect-src 'self' https://*.supabase.co; base-uri 'none'; form-action 'none'">
<title>YFM Finance — Gestão Financeira</title>
<meta name="description" content="Painel de gestão financeira com DRE e fluxo de caixa, com contas separadas por cliente.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 40 40'%3E%3Crect width='40' height='40' rx='10' fill='%23FFC800'/%3E%3Ctext x='20' y='26' text-anchor='middle' font-family='Arial' font-weight='800' font-size='15'%3EYFM%3C/text%3E%3C/svg%3E">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Sora:wght@600;700;800&display=swap" rel="stylesheet">
<style>
:root{--y:#FFC800;--k:#000;--ink:#111;--mut:#6b6b6b;--line:#e6e6e6;--bg:#f2f2f2;--card:#fff;--up:#0e9f6e;--down:#e5484d;--r:14px;--f:Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 var(--f)}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--y);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
header{background:var(--k);color:#fff;position:sticky;top:0;z-index:10}
.bar{max-width:1240px;margin:auto;padding:0 24px;height:64px;display:flex;align-items:center;gap:28px}
.logo{display:flex;align-items:center;gap:10px;font-weight:800;font-size:18px;letter-spacing:-.4px}
.logo i{width:32px;height:32px;border-radius:8px;background:var(--y);color:#000;display:grid;place-items:center;font-style:normal;font-weight:800;font-size:13px}
.logo span{font-weight:500;color:#bdbdbd}
nav{display:flex;gap:4px;height:100%;overflow-x:auto;scrollbar-width:none}
nav button{background:none;border:0;color:#bdbdbd;padding:0 14px;height:100%;font-weight:600;font-size:14px;white-space:nowrap;border-bottom:3px solid transparent}
nav button:hover{color:#fff}
nav button.on{color:#fff;border-bottom-color:var(--y)}
.who{margin-left:auto;display:flex;align-items:center;gap:12px;font-size:13px;color:#d8d8d8;white-space:nowrap}
.who b{width:32px;height:32px;border-radius:50%;background:var(--y);color:#000;display:grid;place-items:center;font-size:13px}
main{max-width:1240px;margin:auto;padding:28px 24px 48px}
.demo{background:#fff8d6;border:1px solid #f1dd86;border-radius:10px;padding:10px 14px;font-size:13px;margin-bottom:22px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap;margin-bottom:20px}
h1{font-size:30px;letter-spacing:-.8px;margin:0;line-height:1.15}
.sub{color:var(--mut);font-size:14px;margin:4px 0 0}
.seg{display:flex;background:#fff;border:1px solid var(--line);border-radius:99px;padding:3px}
.seg button{border:0;background:none;padding:7px 16px;border-radius:99px;font-size:13px;font-weight:600;color:var(--mut)}
.seg button.on{background:var(--k);color:#fff}
.hero{background:var(--k);color:#fff;border-radius:var(--r);padding:28px 30px;display:flex;justify-content:space-between;gap:24px;flex-wrap:wrap;align-items:center;margin-bottom:16px;border-bottom:5px solid var(--y)}
.hero small{color:#aaa;font-size:13px}
.hero .big{font-size:clamp(34px,5vw,48px);font-weight:800;letter-spacing:-1.5px;color:var(--y);line-height:1.1;margin-top:4px}
.hero .side{display:flex;gap:36px}
.hero .side div{font-size:13px;color:#aaa}
.hero .side b{display:block;font-size:20px;color:#fff;margin-top:2px}
.grid4{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:16px}
.card{background:var(--card);border-radius:var(--r);padding:22px;border:1px solid var(--line);min-width:0}
.kpi small{color:var(--mut);font-size:13px;font-weight:600}
.kpi .v{font-size:26px;font-weight:800;letter-spacing:-.8px;margin:6px 0}
.chip{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:99px}
.chip.g{background:#e3f6ee;color:var(--up)}.chip.r{background:#fde8e9;color:var(--down)}.chip.n{background:#eee;color:var(--mut)}
.cols{display:grid;grid-template-columns:1.7fr 1fr;gap:16px}
.stack{display:grid;gap:16px;align-content:start}
h2{font-size:17px;margin:0 0 2px;letter-spacing:-.3px}
.leg{display:flex;gap:16px;font-size:13px;color:var(--mut);margin:10px 0}
.leg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px}
svg.ch{width:100%;height:auto;display:block}
.row{display:flex;align-items:center;gap:12px;padding:12px 0;border-bottom:1px solid var(--line)}
.row:last-child{border:0}
.ic{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;font-weight:800;flex-shrink:0}
.ic.in{background:#e3f6ee;color:var(--up)}.ic.out{background:#fde8e9;color:var(--down)}
.row .t{flex:1;min-width:0}.row .t b{display:block;font-size:14px}.row .t span{font-size:12px;color:var(--mut)}
.in{color:var(--up)}.out{color:var(--down)}
.btn{background:var(--y);color:#000;border:0;border-radius:99px;padding:9px 18px;font-weight:700;font-size:13px}
.btn.o{background:#fff;border:1px solid var(--line)}
.sumrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:14px 0}
.sumrow div{background:var(--bg);border-radius:10px;padding:12px;font-size:12px;color:var(--mut)}
.sumrow b{display:block;font-size:17px;color:var(--ink);margin-top:2px}
table{width:100%;border-collapse:collapse;font-size:14px}
th{font-size:12px;color:var(--mut);text-align:left;font-weight:600;padding:8px 10px;border-bottom:2px solid var(--ink)}
td{padding:11px 10px;border-bottom:1px solid var(--line)}
th.r,td.r{text-align:right}
tr.tot td{font-weight:800;border-top:2px solid var(--ink);background:#fafafa}
tr.sub td{font-weight:700;background:#fafafa}
td.ind{padding-left:28px;color:var(--mut)}
.pill{font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px}
.pill.pago{background:#e3f6ee;color:var(--up)}.pill.pendente{background:#fff3c4;color:#8a6a00}
.tools{display:flex;gap:10px;margin-bottom:14px;flex-wrap:wrap}
.tools input{flex:1;min-width:200px;border:1px solid var(--line);border-radius:99px;padding:9px 16px;font:inherit;background:#fff}
.empty{text-align:center;color:var(--mut);padding:36px 0}
.scroll{overflow-x:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%) translateY(20px);background:#000;color:#fff;padding:11px 18px;border-radius:99px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;border-left:4px solid var(--y)}
#toast.s{opacity:1;transform:translateX(-50%)}
.note{color:var(--mut);font-size:12px;margin-top:18px}
@media(max-width:900px){.cols{grid-template-columns:1fr}.grid4{grid-template-columns:1fr}.bar{gap:14px;padding:0 14px}.who span{display:none}main{padding:20px 14px 40px}.hero{padding:22px}}

#lock{position:fixed;inset:0;z-index:50;background:var(--k);display:grid;place-items:center;padding:20px;overflow:auto}
#lock[hidden]{display:none}
.lk{background:#fff;border-radius:var(--r);padding:30px;width:100%;max-width:420px;border-bottom:5px solid var(--y)}
.lk h1{font-size:24px;margin:16px 0 4px}
.lk .btn{width:100%;margin-top:18px;padding:12px}
.lk .lnk{background:none;border:0;color:var(--mut);font-size:13px;text-decoration:underline;padding:0;margin:14px 16px 0 0}
label.f{display:block;font-size:13px;font-weight:600;margin:14px 0 6px}
.in2{width:100%;border:1px solid #d4d4d4;border-radius:10px;padding:11px 13px;font:inherit;background:#fff;color:var(--ink)}
.err{color:var(--down);font-size:13px;min-height:20px;margin-top:10px}
.adm{display:grid;gap:16px}
.ln{display:grid;grid-template-columns:1.3fr 1fr auto auto;gap:8px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}
.ln:last-child{border:0}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}
.btn.d{background:#fde8e9;color:var(--down)}
.btn.sm{padding:7px 13px}
.who .in2{background:#1b1b1b;border-color:#333;color:#fff}
@media(max-width:900px){.ln,.g3{grid-template-columns:1fr}}
:root{--h:Sora,Inter,system-ui,sans-serif}
h1,h2,.big,.kpi .v,.logo,.hero .side b,.sumrow b,.lk h1{font-family:var(--h)}
body{-webkit-font-smoothing:antialiased;letter-spacing:-.005em}
h1{font-size:34px;letter-spacing:-1.2px;font-weight:800}
h2{font-size:19px;font-weight:700;letter-spacing:-.5px}
.hero .big{font-weight:800;letter-spacing:-2px}

.kpi small,.hero small,th{text-transform:uppercase;letter-spacing:.07em;font-size:11px;font-weight:600}
.btn{font-weight:700;letter-spacing:.01em}
.pw-h{font-size:12px;color:var(--mut);margin-top:6px}

/* página inicial */
#landing{position:fixed;inset:0;z-index:40;overflow:auto;background:#fff}
#landing[hidden]{display:none}
.ld-w{max-width:1100px;margin:auto;padding:0 24px}
.ld-h{position:sticky;top:0;background:#000;color:#fff;z-index:2}
.ld-h .ld-w{display:flex;justify-content:space-between;align-items:center;height:64px}

.ld-g{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.ld-g .card h3{font-family:var(--h);font-size:17px;margin:0 0 6px}
.ld-g .card p{margin:0;color:var(--mut);font-size:14px}
.ld-n{display:inline-grid;place-items:center;width:34px;height:34px;border-radius:50%;background:var(--y);font-weight:800;margin-bottom:10px}
.ld-s details{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin-bottom:10px}

.ld-s details p{color:var(--mut);margin:10px 0 0}
.ld-s ul{padding-left:18px;margin:0;display:grid;gap:8px}
.ld-cta2{background:var(--y);padding:56px 0;text-align:center}
.ld-cta2 h2{font-size:30px;margin:0 0 18px;letter-spacing:-.8px}
.ld-cta2 .btn{background:#000;color:#fff}
.ld-cta2 .btn.o{background:#fff;color:#000}
.ld-f{background:#000;color:#999;padding:24px 0;font-size:13px}
@media(max-width:900px){.ld-hg,.ld-g{grid-template-columns:1fr}.ld-nav a{display:none}.ld-s{padding:44px 0}}

input[type=range]{width:100%;accent-color:#000}
.sc{display:flex;gap:8px;flex-wrap:wrap}
.printhead{display:none}
@media(max-width:900px){.grid4[style*="repeat(4"]{grid-template-columns:1fr 1fr!important}}
@media print{header,nav,.seg,.btn,.tools,#toast,#lock,#landing,.demo,.sc,input[type=range]{display:none!important}body{background:#fff}.card{border:1px solid #ddd;break-inside:avoid}main{padding:0}.printhead{display:block!important;font-weight:700;margin-bottom:12px}}
</style>

<body>
<header><div class="bar">
  <div class="logo"><i>YFM</i>Finance</div>
  <nav id="nav" aria-label="Navegação principal"></nav>
  <div class="who"><span id="uName"></span><select id="coSel" class="in2" style="width:auto;padding:6px 10px" hidden aria-label="Trocar empresa"></select><button class="btn o btn sm" data-act="sup">Suporte</button><button class="btn sm" data-act="out">Sair</button></div>
</div></header>
<noscript><p style="padding:24px;font:16px sans-serif">Ative o JavaScript do navegador para usar o YFM Finance.</p></noscript>
<main id="app"></main>
<div id="landing" hidden></div>
<div id="lock"></div>
<div id="toast" role="status"></div>
<script id="cfg" type="application/json">{"url":"COLE_AQUI_A_URL_DO_SUPABASE","key":"COLE_AQUI_A_CHAVE_ANON","suporte":"strategicfinanceleadfinancelea@gmail.com"}</script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js" integrity="sha384-0w2KAL2YHP6wKOkUDzkCDGgVvfmHnj02DHeQ6XcHOgTfFsGyonKOpShMH1x6nk9o" crossorigin="anonymous"></script>
<script>
/* ===== YFM Finance: DRE avançado, fluxo de caixa projetado, importação de extrato e página inicial ===== */
const SCEN={otimista:[10,-5],realista:[0,0],pessimista:[-15,10]};
const keyAt=k=>{const d=new Date();return iso(new Date(d.getFullYear(),d.getMonth()-k,1))};
const mlabel=k=>MON[+keyAt(k).slice(5)-1];
const win=(n,off)=>Array.from({length:n},(_,i)=>keyAt(off+n-1-i));
const pct1=x=>x.toFixed(1).replace('.',',')+'%';
const num2=v=>v.toFixed(2).replace('.',',');
function dl(name,txt,type){const u=URL.createObjectURL(new Blob(['\ufeff'+txt],{type}));const a=document.createElement('a');a.href=u;a.download=name;a.click();URL.revokeObjectURL(u)}

/* ---------- DRE ---------- */
function dreCalc(keys){const sm=(t,c)=>sum(cur().tx.filter(x=>x.s==='pago'&&x.t===t&&keys.includes(x.d.slice(0,7))&&(!c||x.c===c)).map(x=>x.v));
 const rb=sm('in'),ded=sm('out','Impostos sobre vendas'),cmv=sm('out','CMV'),pes=sm('out','Despesa com pessoal'),adm=sm('out','Despesa administrativa'),fin=sm('out','Despesa financeira');
 const rl=rb-ded,lb=rl-cmv,ro=lb-pes-adm,ll=ro-fin,fx=pes+adm+fin,mcp=rb?(rb-ded-cmv)/rb:0,pe=mcp>0?fx/mcp:null;
 return {rb,ded,cmv,pes,adm,fin,rl,lb,ro,ll,ebitda:ro,fx,mcp,pe,seg:pe!=null&&rb>0?(rb-pe)/rb:null}}
function dreRows(c){return [['Receita bruta',c.rb,'sub'],['(−) Impostos sobre vendas',-c.ded,'ind'],['(=) Receita líquida',c.rl,'sub'],['(−) Custo das mercadorias (CMV)',-c.cmv,'ind'],['(=) Lucro bruto',c.lb,'sub'],['(−) Despesas com pessoal',-c.pes,'ind'],['(−) Despesas administrativas',-c.adm,'ind'],['(=) Resultado operacional (EBIT)',c.ro,'sub'],['(−) Despesas financeiras',-c.fin,'ind'],['(=) Lucro líquido do período',c.ll,'tot']]}
function indicators(c){const rb=c.rb,m=x=>rb?pct1(x/rb*100):'–';
 const k=[['Margem bruta',m(c.lb),'Quanto sobra da receita depois dos impostos e do custo das mercadorias.'],['Margem operacional',m(c.ro),'Resultado das operações, antes das despesas financeiras.'],['Margem líquida',m(c.ll),'Quanto sobra de cada R$ 100 vendidos depois de tudo.'],['EBITDA*',R(c.ebitda),'Resultado operacional (sem depreciação lançada).'],['Ponto de equilíbrio',c.pe!=null?R(c.pe):'–','Receita mínima do período para cobrir os custos fixos.'],['Margem de segurança',c.seg!=null?pct1(c.seg*100):'–','Quanto a receita pode cair antes de dar prejuízo.']];
 return `<div class="grid4" style="margin-top:16px">${k.map(([l,v,h])=>`<div class="card kpi"><small>${l}</small><div class="v num">${v}</div><span class="sub">${h}</span></div>`).join('')}</div>`}
function waterfall(c){if(!c.rb)return '<div class="empty">Sem receita no período para montar o gráfico.</div>';
 let run=0;const bars=[['Receita',c.rb],['Impostos',-c.ded],['CMV',-c.cmv],['Pessoal',-c.pes],['Adm.',-c.adm],['Financ.',-c.fin],['Lucro',c.ll]].map(([l,v])=>{let a,b;if(l==='Receita'){a=0;b=v;run=v}else if(l==='Lucro'){a=0;b=v}else{a=run;b=run+v;run=b}
  return{l,v,lo:Math.min(a,b),hi:Math.max(a,b),k:l==='Receita'?'#111':l==='Lucro'?(v>=0?'#0e9f6e':'#e5484d'):'#e5484d'}});
 const mx=Math.max(...bars.map(x=>x.hi),1),mn=Math.min(...bars.map(x=>x.lo),0),W=700,H=260,pl=10,pt=24,pb=30,ih=H-pt-pb,y=v=>pt+ih-(v-mn)/(mx-mn)*ih,gw=(W-2*pl)/bars.length,bw=Math.min(54,gw*.6);
 return `<svg class="ch" viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfico em cascata: da receita ao lucro"><line x1="${pl}" x2="${W-pl}" y1="${y(0)}" y2="${y(0)}" stroke="#ccc"/>${bars.map((b,i)=>{const x=pl+i*gw+(gw-bw)/2,y1=y(b.hi),h=Math.max(2,y(b.lo)-y1);return `<rect x="${x}" y="${y1}" width="${bw}" height="${h}" rx="4" fill="${b.k}"><title>${b.l}: ${R(b.v)}</title></rect><text x="${x+bw/2}" y="${y1-6}" text-anchor="middle" font-size="11" font-weight="700" fill="#111">${R0(Math.abs(b.v))}</text><text x="${x+bw/2}" y="${H-8}" text-anchor="middle" font-size="12" fill="#6b6b6b">${b.l}</text>`}).join('')}</svg>`}
function dreView(){const n=st.n,c=dreCalc(win(n,0)),p=dreCalc(win(n,n)),cr=dreRows(c),pr=dreRows(p),rb=c.rb;
 const vr=(a,b,ind)=>b?(ind?(Math.abs(a)-Math.abs(b))/Math.abs(b):(a-b)/Math.abs(b))*100:null,label=n===1?mlabel(0):mlabel(n-1)+' a '+mlabel(0);
 return `<div class="head"><div><h1>DRE</h1><p class="sub">Demonstração do Resultado do Exercício · ${esc(cur().name)} · ${label}</p></div>
 <div style="display:flex;gap:10px;flex-wrap:wrap;align-items:center"><div class="seg" role="group" aria-label="Período">${[[1,'Este mês'],[3,'3 meses'],[6,'6 meses']].map(([k,t])=>`<button data-n="${k}" class="${st.n===k?'on':''}">${t}</button>`).join('')}</div><button class="btn o sm" data-act="csvdre">Planilha (CSV)</button><button class="btn sm" data-act="print">Exportar PDF</button></div></div>
 <section class="card scroll"><table><thead><tr><th>Conta</th><th class="r">Valor</th><th class="r">% da receita (vertical)</th><th class="r">Período anterior</th><th class="r">Variação (horizontal)</th></tr></thead><tbody>
 ${cr.map(([nm,v,k],i)=>`<tr class="${k==='ind'?'':k}"><td class="${k==='ind'?'ind':''}">${nm}</td><td class="r num ${v<0?'out':k==='tot'?(v>=0?'in':'out'):''}">${R(v)}</td><td class="r num">${rb?pct1(v/rb*100):'0,0%'}</td><td class="r num">${R(pr[i][1])}</td><td class="r">${chip(vr(v,pr[i][1],k==='ind'),k==='ind')}</td></tr>`).join('')}</tbody></table></section>
 ${indicators(c)}
 <section class="card" style="margin-top:16px"><h2>Da receita ao lucro</h2><p class="sub">Gráfico em cascata do período</p>${waterfall(c)}</section>
 <p class="note">Estrutura conforme a Lei 6.404/76, calculada a partir dos lançamentos pagos (regime de caixa). Período anterior = mesmo número de meses imediatamente antes. *O EBITDA é igual ao resultado operacional porque o sistema não registra depreciação.</p>`}

function parseExtrato(txt){const out=[];
 if(/<STMTTRN>/i.test(txt)){txt.split(/<STMTTRN>/i).slice(1).forEach(b=>{const g=t=>{const m=b.match(new RegExp('<'+t+'>([^<\\r\\n]*)','i'));return m?m[1].trim():''};
  const dt=g('DTPOSTED').replace(/\D/g,'').slice(0,8),v=parseFloat(g('TRNAMT').replace(',','.'));
  if(dt.length===8&&isFinite(v)&&v!==0&&Math.abs(v)<1e9)out.push({d:dt.slice(0,4)+'-'+dt.slice(4,6)+'-'+dt.slice(6,8),n:(g('MEMO')||g('NAME')||'Lançamento importado').slice(0,80),v:Math.abs(v),t:v>0?'in':'out'})});return out}
 const lines=txt.replace(/^\ufeff/,'').split(/\r?\n/).filter(l=>l.trim());if(!lines.length)return out;
 const sep=(lines[0].match(/;/g)||[]).length>=(lines[0].match(/,/g)||[]).length?';':',',cells=l=>l.split(sep).map(c=>c.trim().replace(/^"|"$/g,''));
 const h=cells(lines[0]),hasH=h.some(c=>/data|date/i.test(c)&&!/\d{2}[\/-]\d{2}/.test(c)),col=(re,fb)=>{const i=hasH?h.findIndex(c=>re.test(c)):-1;return i>=0?i:fb};
 const ci=col(/data|date/i,0),cd=col(/descri|hist|memo|nome/i,1),cv=col(/valor|amount|value/i,2);
 lines.slice(hasH?1:0).forEach(l=>{const c=cells(l);let d=c[ci]||'',m;
  if((m=d.match(/^(\d{2})[\/-](\d{2})[\/-](\d{4})/)))d=m[3]+'-'+m[2]+'-'+m[1];else if(!/^\d{4}-\d{2}-\d{2}/.test(d))return;d=d.slice(0,10);
  const v=pv((c[cv]||'').replace(/[^\d,.\-]/g,''));if(!isFinite(v)||v===0||Math.abs(v)>=1e9)return;
  out.push({d,n:(c[cd]||'Lançamento importado').slice(0,80),v:Math.abs(v),t:v>0?'in':'out'})});return out}
const dkey=x=>x.d+'|'+x.n+'|'+Math.round(x.v*100)+'|'+x.t;

 <section class="card"><h2>Contas de clientes (${cl.length})</h2>${cl.length?cl.map(u=>`<div class="ln" style="grid-template-columns:1.3fr 1fr auto"><div><b>${esc(u.u)}</b><br><span class="sub">${esc(u.email||'')}</span><br><span class="chip n" style="margin-top:6px">${esc((A.co.find(c=>c.id===u.co)||{}).name||'sem empresa')}</span></div><div style="display:flex;gap:6px"><input class="in2" id="pwn_${u.id}" type="password" placeholder="Nova senha (mín. 10)" autocomplete="new-password" aria-label="Nova senha de ${esc(u.u)}"><button class="btn sm" data-act="setpw" data-id="${u.id}">Definir</button></div><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn sm" data-act="golaunch" data-id="${u.id}">Lançar dados</button><button class="btn o sm" data-act="resetcli" data-id="${u.id}">Enviar link de nova senha</button><button class="btn d sm" data-act="deluser" data-id="${u.id}">Remover acesso</button></div></div>`).join(''):'<div class="empty">Nenhum cliente ainda. Crie o primeiro acima.</div>'}</section></div>`}
function adminView(){return `<div class="head"><div><h1>Empresas</h1><p class="sub">Cadastre e organize as empresas que você atende.</p></div></div><div class="adm"><section class="card"><h2>Empresas cadastradas</h2>${A.co.map(c=>`<div class="ln" style="grid-template-columns:1fr auto"><input class="in2" id="nm_${c.id}" value="${esc(c.name)}" aria-label="Nome da empresa"><div style="display:flex;gap:6px;flex-wrap:wrap"><button class="btn o sm" data-act="renco" data-id="${c.id}">Renomear</button><button class="btn d sm" data-act="delco" data-id="${c.id}">Excluir</button></div></div>`).join('')}
 <div class="tools" style="margin:16px 0 0"><input class="in2" id="new" placeholder="Nome da nova empresa" aria-label="Nome da nova empresa" style="flex:1"><button class="btn" data-act="addco">Adicionar empresa</button></div></section>
 <p class="note">Excluir uma empresa apaga os lançamentos dela e deixa sem empresa as contas de clientes ligadas a ela. Para apagar de vez um login, use Authentication &gt; Users no painel do Supabase.</p></div>`}
document.addEventListener('submit',async e=>{e.preventDefault();const f=e.target.id,err=m=>{$('#err').textContent=m};
 if(f==='login'){const email=$('#us').value.trim().toLowerCase(),pw=$('#pw').value;
  if(!configured())return err('O login ainda não foi configurado neste site.');
  if(!okMail(email)||!pw)return err('Informe e-mail e senha.');
  if(Date.now()<until)return err('Muitas tentativas. Tente de novo em '+Math.ceil((until-Date.now())/1000)+' s.');
  const {data,error}=await sb.auth.signInWithPassword({email,password:pw});
  if(error){if(++fails>=5){until=Date.now()+30000;fails=0}return err('E-mail ou senha incorretos.')}
  fails=0;await proceed(data.user,err)}
 if(f==='mfa'){const code=$('#mc').value.replace(/\s/g,'');if(!/^\d{6}$/.test(code))return err('Digite os 6 números do código.');
  if(Date.now()<until)return err('Muitas tentativas. Tente de novo em '+Math.ceil((until-Date.now())/1000)+' s.');
  const ch=await sb.auth.mfa.challenge({factorId:PEND.factor});if(ch.error)return err('Não foi possível verificar. Tente de novo.');
  const vr=await sb.auth.mfa.verify({factorId:PEND.factor,challengeId:ch.data.id,code});
  if(vr.error){if(++fails>=5){until=Date.now()+30000;fails=0}return err('Código incorreto.')}
  fails=0;const pd=PEND;PEND=null;
  try{enter(await loadData(pd.uid,pd.email))}catch(x){await sb.auth.signOut();A=null;lockView('Esta conta ainda não tem acesso liberado. Fale com o suporte.')}}
 if(f==='newpw'){const p=$('#n1').value,pe=pwErr(p);if(pe)return err(pe);if(p!==$('#n2').value)return err('As senhas não são iguais.');
  const {error}=await sb.auth.updateUser({password:p});if(error)return err('Não foi possível salvar: '+error.message);await sb.auth.signOut();lockView('Senha alterada. Entre com a nova senha.')}});
document.addEventListener('change',e=>{if(e.target.id==='tt'){st.nt=e.target.value;render();return}
 if(e.target.id==='coSel'&&S&&S.admin&&A.co.some(c=>c.id===e.target.value)){S.co=e.target.value;useCo();render()}});
document.addEventListener('click',async e=>{const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=b.dataset.id,v=i=>$('#'+i).value;
 if(a==='demo'){const c=seedCo('c1','Padaria Estrela Ltda',1,true);A={tmp:true,co:[c],us:[{id:'demo',u:'Visitante',role:'empresa',co:'c1'}]};return enter(A.us[0])}
 if(a==='out'){showLogin=false;if(sb&&!(A&&A.tmp))await sb.auth.signOut().catch(()=>{});return lockView()}
 if(a==='sup'||a==='sup2')return support('Dúvida de uso');
 if(a==='showlogin'){showLogin=true;return lockView()}
 if(a==='csvdre'){dl('yfm-dre-'+(cur().name||'empresa').replace(/\W+/g,'-')+'.csv',csvDre(),'text/csv');return toast('Planilha baixada.')}
 if(a==='csvfluxo'){dl('yfm-fluxo-de-caixa.csv',csvFluxo(),'text/csv');return toast('Planilha baixada.')}
 if(a==='print'){window.print();return}
 if(a==='sc'){const q=st.pj||(st.pj={n:6,e:0,s:0,sc:'realista'});q.sc=b.dataset.sc;[q.e,q.s]=SCEN[q.sc];return render()}
 if(a==='pn'){(st.pj||(st.pj={n:6,e:0,s:0,sc:'realista'})).n=+b.dataset.pn;return render()}
 if(a==='mfacancel'){PEND=null;await sb.auth.signOut().catch(()=>{});return lockView()}
 if(a==='forgot'){if(!configured())return;const em=$('#us').value.trim().toLowerCase();if(!okMail(em))return $('#err').textContent='Digite seu e-mail no campo acima e clique de novo.';
  await sb.auth.resetPasswordForEmail(em,{redirectTo:location.origin+location.pathname});return $('#err').textContent='Se esse e-mail tiver conta, enviamos um link para criar uma nova senha.'}
 if(!S||A.tmp)return;
 const us=A.us.find(x=>x.id===id),co=A.co.find(x=>x.id===id);
 if(a==='chpw'){const em=U().email,{error:e1}=await sb.auth.signInWithPassword({email:em,password:v('c0')});if(e1)return toast('Senha atual incorreta.');
  const pe=pwErr(v('c1'));if(pe)return toast(pe);if(v('c1')!==v('c2'))return toast('As senhas novas não são iguais.');
  const {error}=await sb.auth.updateUser({password:v('c1')});render();return toast(error?'Não foi possível alterar: '+error.message:'Senha alterada.')}
 if(!S.admin)return;
 if(a==='addtx'){const t=v('tt'),n=v('tn').trim(),val=pv(v('tv')),d=v('td'),c=v('tc');
  if(!n)return toast('Informe a descrição.');if(!(val>0&&val<1e9))return toast('Informe um valor maior que zero.');
  if(!/^\d{4}-\d{2}-\d{2}$/.test(d)||+d.slice(0,4)<2000||+d.slice(0,4)>2100)return toast('Informe uma data válida.');
  if(!CATS[t]||!CATS[t].includes(c))return toast('Categoria inválida.');
  return void await w(sb.from('transactions').insert({company_id:S.co,d,n,c,v:Math.round(val*100)/100,t,s:v('ts')==='pendente'?'pendente':'pago'}),'Lançamento adicionado.')}
 if(a==='impcancel'){st.imp=null;return render()}
 if(a==='doimport'){const rows=impNovos().map(x=>({company_id:S.co,d:x.d,n:x.n,c:CATS[x.t].includes(x.c)?x.c:CATS[x.t][0],v:Math.round(x.v*100)/100,t:x.t,s:'pago'}));if(!rows.length)return toast('Nada novo para importar.');st.imp=null;return void await w(sb.from('transactions').insert(rows),rows.length+' lançamentos importados.')}
 if(a==='setpw'){const pw=v('pwn_'+id),pe=pwErr(pw);if(pe)return toast(pe);const r=await sb.functions.invoke('admin-users',{body:{action:'set_password',user_id:id,password:pw}});return toast(r.error||(r.data&&r.data.error)?'Não foi possível trocar a senha. A função "admin-users" está instalada? (veja o guia). Alternativa: envie o link por e-mail.':'Senha alterada. Informe a nova senha ao cliente.')}
 if(a==='pay')return void await w(sb.from('transactions').update({s:'pago'}).eq('id',id).eq('company_id',S.co));
 if(a==='deltx'){if(!confirm('Enviar este lançamento para a lixeira? Você poderá restaurá-lo na aba Segurança.'))return;return void await w(sb.from('transactions').update({deleted_at:new Date().toISOString()}).eq('id',id).eq('company_id',S.co),'Enviado para a lixeira.')}
 if(a==='restore')return void await w(sb.from('transactions').update({deleted_at:null}).eq('id',id).eq('company_id',S.co),'Lançamento restaurado.');
 if(a==='backup'){const u=URL.createObjectURL(new Blob([backupData()],{type:'application/json'})),el=document.createElement('a');el.href=u;el.download='yfm-finance-backup-'+new Date().toISOString().slice(0,10)+'.json';el.click();URL.revokeObjectURL(u);return toast('Backup baixado. Guarde em um local seguro.')}
 if(a==='golaunch'){if(!us||!A.co.some(c=>c.id===us.co))return;S.co=us.co;useCo();st.view='Novo lançamento';return render()}
 if(a==='addcli'){const nome=v('cn').trim(),em=v('cm').trim().toLowerCase(),pw=v('cp'),e2=v('ce');
  if(nome.length<3)return toast('Informe o nome do cliente (mínimo 3 letras).');if(!okMail(em))return toast('Informe um e-mail válido.');
  const pe=pwErr(pw);if(pe)return toast(pe);if(A.us.some(x=>(x.email||'')===em))return toast('Já existe uma conta com esse e-mail.');
  if(e2!=='new'&&!A.co.some(c=>c.id===e2))return toast('Escolha uma empresa válida.');
  const {data,error}=await mkClient(false).auth.signUp({email:em,password:pw});
  if(error)return toast(/already/i.test(error.message)?'Esse e-mail já existe no Supabase. Apague-o em Authentication > Users e tente de novo.':'Não foi possível criar: '+error.message);
  if(!data.user||(data.user.identities&&!data.user.identities.length))return toast('Esse e-mail já existe no Supabase. Apague-o em Authentication > Users e tente de novo.');
  let cid=e2;if(e2==='new'){const r=await sb.from('companies').insert({name:nome}).select().single();if(r.error)return toast('Erro ao criar a empresa: '+r.error.message);cid=r.data.id}
  const r2=await sb.from('profiles').insert({user_id:data.user.id,name:nome,email:em,role:'cliente',company_id:cid});
  if(r2.error)return toast('Login criado, mas o acesso não foi liberado: '+r2.error.message);
  await refresh();return toast('Conta do cliente criada.')}
 if(a==='deluser'){if(!us||!confirm('Remover o acesso de "'+us.u+'"? Ele não conseguirá mais ver a empresa.'))return;const okr=await w(sb.from('profiles').delete().eq('user_id',id),'Acesso removido.');if(okr)sb.functions.invoke('admin-users',{body:{action:'delete_user',user_id:id}}).catch(()=>{});return}
 if(a==='resetcli'){if(!us||!us.email)return;const {error}=await sb.auth.resetPasswordForEmail(us.email,{redirectTo:location.origin+location.pathname});return toast(error?'Não foi possível enviar: '+error.message:'Link de nova senha enviado para '+us.email+'.')}
 if(a==='renco'){const n=v('nm_'+id).trim();if(!n)return toast('Informe o nome da empresa.');return void await w(sb.from('companies').update({name:n}).eq('id',id),'Empresa renomeada.')}
 if(a==='delco'){if(A.co.length<2)return toast('Mantenha pelo menos uma empresa.');if(prompt('Isto apaga a empresa e TODOS os lançamentos dela.\nPara confirmar, digite exatamente o nome da empresa:\n'+co.name)!==co.name)return toast('Nome diferente. Nada foi excluído.');return void await w(sb.from('companies').delete().eq('id',id),'Empresa excluída.')}
 if(a==='addco'){const n=v('new').trim();if(!n)return toast('Informe o nome da empresa.');return void await w(sb.from('companies').insert({name:n}),'Empresa adicionada.')}});
['click','keydown','touchstart'].forEach(ev=>addEventListener(ev,()=>{last=Date.now()},{passive:true}));
setInterval(()=>{if(S&&Date.now()-last>IDLE){if(sb&&!(A&&A.tmp))sb.auth.signOut().catch(()=>{});lockView('Sessão encerrada por inatividade.')}},30000);
async function boot(){try{const r=await fetch('config.json',{cache:'no-store'});if(r.ok)Object.assign(CFG,await r.json())}catch(e){}
 if(configured()){sb=mkClient(true);sb.auth.onAuthStateChange(ev=>{if(ev==='PASSWORD_RECOVERY')recoveryView()})}lockView()}
boot();
</script>
</body>
</html>
